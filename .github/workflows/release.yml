name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm again (for example v0.1.0-beta.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    if: github.repository == 'Apertur3/headroom' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: bash scripts/smoke-cold.sh

  tarball:
    name: build npm tarball
    needs: verify
    if: github.repository == 'Apertur3/headroom' && startsWith(github.ref, 'refs/tags/v')
    # macOS: the Claude probe (bin/probe/darwin) is built here, before
    # packing, so the published tarball carries a real macOS binary instead
    # of the npm package's `prepack` hook silently no-op'ing on Linux.
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      filename: ${{ steps.pack.outputs.filename }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the packaged Claude probe (universal macOS binary)
        run: bash scripts/build-probe.sh
      - name: Resolve release version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          tag_version="${tag#v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "::error::Tag $tag does not match package.json version $pkg_version"
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
      - name: npm pack
        id: pack
        run: |
          mkdir -p dist-release
          filename="$(npm pack --silent --pack-destination dist-release)"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist-release/*.tgz
          retention-days: 14

  release:
    name: create GitHub release
    needs: tarball
    if: github.repository == 'Apertur3/headroom' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-release
      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ needs.tarball.outputs.version }}
        run: |
          notes_file="$(mktemp)"
          # Prefer an exact "## [VERSION]" section; fall back to "## [Unreleased]"
          # for a release cut straight from the pending log. Plain substring
          # matching (index()) avoids regex-escaping the version string.
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found { if ($0 ~ /^## \[/) exit; print }
          ' CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            awk '
              index($0, "## [Unreleased]") == 1 { found = 1; next }
              found { if ($0 ~ /^## \[/) exit; print }
            ' CHANGELOG.md > "$notes_file"
          fi
          if [[ ! -s "$notes_file" ]]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION (looked for '## [$VERSION]', fell back to '## [Unreleased]'). Add a changelog entry before tagging."
            exit 1
          fi
          echo "path=$notes_file" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tarball.outputs.version }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          prerelease_flag=()
          [[ "$VERSION" == *-* ]] && prerelease_flag=(--prerelease)
          gh release create "$tag" \
            --title "v$VERSION" \
            --notes-file "${{ steps.changelog.outputs.path }}" \
            "${prerelease_flag[@]}" \
            dist-release/*.tgz

  publish:
    name: publish to npm
    needs: [tarball, release]
    if: >-
      always() && github.repository == 'Apertur3/headroom' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      needs.tarball.result != 'failure' && needs.release.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OpenID Connect) needs npm 11.5.1 or newer; Node 22
      # ships an older npm. No token is involved: npmjs.com trusts this
      # repository's release workflow directly and records provenance.
      - run: npm install -g npm@latest && npm --version
      - name: Tarball from this run
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist-release
      - name: Validate the dispatched tag
        # Astra F9: inputs.tag is an unrestricted workflow_dispatch string. It
        # must never be interpolated directly into a `run:` script (double
        # quotes do not stop command substitution) -- pass it through env and
        # check it against the release-tag grammar before anything uses it.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Dispatched tag '$RELEASE_TAG' does not match the expected vX.Y.Z[-PRERELEASE] grammar"
            exit 1
          fi
      - name: Tarball from the existing release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern '*.tgz' --dir dist-release
      - name: Verify the downloaded tarball's version matches the dispatched tag
        # A validated tag grammar alone does not guarantee the release asset
        # for that tag actually carries a matching package.json -- refuse a
        # mismatch rather than publish whatever gh happened to download.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tarball="$(ls dist-release/*.tgz)"
          tar -xOzf "$tarball" package/package.json > tarball-package.json
          tarball_version="$(node -p 'require("./tarball-package.json").version')"
          expected_version="${RELEASE_TAG#v}"
          rm -f tarball-package.json
          if [[ "$tarball_version" != "$expected_version" ]]; then
            echo "::error::Downloaded tarball package.json version ($tarball_version) does not match dispatched tag $RELEASE_TAG"
            exit 1
          fi
      - name: npm publish
        id: publish
        continue-on-error: true
        run: |
          # The leading ./ matters: a bare "dir/name.tgz" is read by npm as a
          # GitHub shorthand and refused.
          tarball="./$(ls dist-release/*.tgz)"
          npm publish "$tarball" --provenance --access public --tag latest
      - name: Publish did not happen
        if: ${{ steps.publish.outcome == 'failure' }}
        run: |
          echo "::warning title=npm publish skipped::npm refused the publish. Either the trusted publisher for this repository and workflow is not configured on npmjs.com yet, or this version already exists. The GitHub release was created; run this workflow manually with the tag to publish again."

  homebrew:
    name: update the Homebrew tap
    needs: [tarball, publish]
    # Tag pushes only. A workflow_dispatch re-publish is a repair of an npm
    # publish that did not take; the tap already points at the same tarball.
    if: >-
      github.repository == 'Apertur3/headroom' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Read-only here. The write happens in the tap repository, with a token
    # scoped to that repository alone.
    permissions:
      contents: read
    env:
      TAP_REPOSITORY: Apertur3/homebrew-tap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Formula/headroom.rb from the released tarball
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tarball.outputs.version }}
          # Only whether the secret exists, never the secret itself.
          TAP_TOKEN_PRESENT: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          if [[ "$TAP_TOKEN_PRESENT" != "true" ]]; then
            echo "::notice title=Homebrew tap left alone::HOMEBREW_TAP_TOKEN is not set on this repository, so $TAP_REPOSITORY keeps the formula it already has. The npm release itself is unaffected. docs/releasing.md says how to create the token."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The asset the release job attached, not a rebuild: hashing anything
          # else would pin the formula to bytes nobody published.
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir release-asset
          tarball="$(ls release-asset/*.tgz)"
          sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
          # Homebrew downloads the npm registry copy, so the hash is only
          # correct if the registry carries these exact bytes. npm's own
          # dist.integrity is a sha512 of them, which makes that checkable.
          # It also catches the case where the publish step was skipped.
          registry_integrity="$(npm view "headroomd@$VERSION" dist.integrity 2>/dev/null || true)"
          asset_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          if [[ "$registry_integrity" != "$asset_integrity" ]]; then
            echo "::notice title=Homebrew tap left alone::headroomd@$VERSION is not on the npm registry as the same bytes as the release asset (registry reported '${registry_integrity:-nothing}'), so no formula was generated. Publish the version first, then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/homebrew-formula.sh \
            "$VERSION" \
            "https://registry.npmjs.org/headroomd/-/headroomd-$VERSION.tgz" \
            "$sha256" > headroom.rb
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Commit the formula to the tap
        if: ${{ steps.formula.outputs.ready == 'true' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.tarball.outputs.version }}
        run: |
          tap="$(mktemp -d)"
          # Cloned anonymously (the tap is public), so no credential is written
          # to the clone's config and no token ever appears in a remote URL.
          git clone --depth 1 "https://github.com/$TAP_REPOSITORY.git" "$tap"
          branch="$(git -C "$tap" symbolic-ref --short HEAD)"
          mkdir -p "$tap/Formula"
          cp headroom.rb "$tap/Formula/headroom.rb"
          if [[ -z "$(git -C "$tap" status --porcelain)" ]]; then
            echo "::notice title=Homebrew tap already current::$TAP_REPOSITORY already carries the formula for $VERSION; nothing to push."
            exit 0
          fi
          # Assembled from parts because scripts/privacy-sweep.sh refuses any
          # literal email-shaped string in a tracked file. The commit is
          # attributed to a neutral release identity at a GitHub noreply host.
          noreply_host="users.noreply.github.com"
          git -C "$tap" add Formula/headroom.rb
          git -C "$tap" \
            -c user.name="headroom-release" \
            -c user.email="headroom-release@$noreply_host" \
            commit -m "headroom $VERSION"
          # The token is handed to git through a one-shot credential helper on
          # this command alone: it is never written to a config file and never
          # becomes part of a URL that could be echoed by a later git command.
          git -C "$tap" \
            -c credential.helper= \
            -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$HOMEBREW_TAP_TOKEN"; }; f' \
            push origin "HEAD:refs/heads/$branch"
          echo "::notice title=Homebrew tap updated::$TAP_REPOSITORY now installs headroom $VERSION."
