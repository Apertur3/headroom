# Each entry names one credential location. Headroom never stores credentials here.
[[accounts]]
name = "codex-main"
vendor = "codex"
location = "~/.codex"
adapter = "native-ts"

[[accounts]]
name = "claude-main"
vendor = "claude"
location = "~/.claude"
adapter = "native-ts"

[[accounts]]
name = "claude-2"
vendor = "claude"
location = "~/.claude2"
adapter = "native-ts"

[[accounts]]
name = "antigravity"
vendor = "antigravity"
location = "~/.gemini/antigravity-cli"
adapter = "native-ts"

# Grok reads the token `grok login` writes. `location` may name the token file
# itself or the directory holding it; the default is ~/.grok, or GROK_HOME.
# [[accounts]]
# name = "grok"
# vendor = "grok"
# location = "~/.grok"
# adapter = "native-ts"

# Kimi, preferred source: the credential the Kimi Code CLI writes for itself
# (`kimi login`). Headroom reads it, never refreshes it, and calls the CLI's own
# usages endpoint with it.
# [[accounts]]
# name = "kimi"
# vendor = "kimi"
# location = "~/.kimi-code/credentials/kimi-code.json"
# adapter = "native-ts"

# Kimi, alternative source: a file you write yourself, mode 0600, holding only
# the kimi-auth token from https://www.kimi.com/code/console. For the desktop
# app, which keeps that token in a browser cookie store this project does not
# open. Put an optional Moonshot API key in a `moonshot.key` file beside either
# credential to also get a credits meter. See docs/vendors.md.
# [[accounts]]
# name = "kimi"
# vendor = "kimi"
# location = "~/.kimi/auth.token"
# adapter = "native-ts"

# The Gemini CLI subscription (Gemini Code Assist quota). `location` is the
# Gemini home holding oauth_creds.json: ~/.gemini, or the .gemini under a
# GEMINI_CLI_HOME override. Discovery names an override principal
# gemini-<home basename>. See docs/vendors.md.
# [[accounts]]
# name = "gemini"
# vendor = "gemini"
# location = "~/.gemini"
# adapter = "native-ts"

# Local pools are probed only; a wake command is reported when down and never run.
