# Each entry names one credential location. Tally never stores credentials here.
[[accounts]]
name = "codex-main"
vendor = "codex"
location = "~/.codex"
adapter = "native"

[[accounts]]
name = "claude-main"
vendor = "claude"
location = "~/.claude"
adapter = "native"

[[accounts]]
name = "claude-2"
vendor = "claude"
location = "~/.claude2"
adapter = "native"

[[accounts]]
name = "antigravity"
vendor = "antigravity"
location = "~/.gemini/antigravity-cli"
adapter = "native"

