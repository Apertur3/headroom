# Copy to ~/.headroom/policy.toml to override Headroom's fail-closed pace policy.
freeze_reserve_pct = 10
# A short burst immediately after reset should not be labelled CONSERVE.
pace_grace_fraction = 0.10
staleness_minutes = 15
poll_interval_minutes = 5
# Keep the daemon-owned `agy` pseudo-terminal warm for real local quota summaries.
# This keeps one background process and pseudo-terminal alive (small but continuous energy cost).
antigravity_keepalive = true
# "even" (default): `gate` enforces the pro-rata line and a 10-minute burst
# check for a 5h request; `fill` only offers a window's full remaining
# points in its last 45 minutes, the pro-rata allowance before that.
# "none" skips both, leaving only the plain reserve/plan-line checks.
pacing = "even"
# Proxy environment variables are ignored. Set this explicitly when a proxy is required.
# proxy = "http://127.0.0.1:8080"
# Per-principal intervals override the default:
# [principal.claude-main]
# interval_minutes = 5
# A protected reserve per meter: percent of EVERY window of that meter that
# gate, fill, route and can never dip into (0-90). Unlike freeze_reserve_pct
# above, which is the FREEZE pace threshold, this only withholds capacity from
# decisions -- pace states are unchanged. Set one on the meter your own
# orchestrator runs on. "*" is the default for meters without their own entry.
# [reserve]
# "claude-main:fable" = 10
# "*" = 5

# --- Notifications (off unless you uncomment [notify] and name a channel) ---
# Delivered by the daemon after each poll, once per event, over the channels
# below. Credentials are never written here: the Telegram bot token and the
# optional webhook bearer are read from the OS secret store at send time.
# See docs/notifications.md for the store command on each platform.
# [notify]
# channels = ["telegram", "ntfy", "webhook"]
# events = ["reset_seen", "free_reset_granted", "source_failed", "source_recovered", "pace_projection_conserve", "model_new", "threshold"]
# # Also notify when any hard window crosses this used percent, once per window.
# threshold_percent = 90
# # Local time. Events inside the range are batched into one message at the end of it.
# quiet_hours = "23:00-07:00"
#
# [notify.telegram]
# chat_id = "123456"
#
# [notify.ntfy]
# topic = "headroom-example"
# # server = "https://ntfy.example.com"
#
# [notify.webhook]
# url = "https://example.com/hook"
