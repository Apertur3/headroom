# Copy to ~/.headroom/policy.toml to override Headroom's fail-closed pace policy.
freeze_reserve_pct = 10
# A short burst immediately after reset should not be labelled CONSERVE.
pace_grace_fraction = 0.10
staleness_minutes = 15
poll_interval_minutes = 5
# Keep the daemon-owned `agy` pseudo-terminal warm for real local quota summaries.
# This keeps one background process and pseudo-terminal alive (small but continuous energy cost).
antigravity_keepalive = true
# Off by default. When true, the hourly model-list check also calls Google's
# undocumented Code Assist `fetchAvailableModels` for Antigravity, using the
# Gemini CLI's OAuth file (~/.gemini/oauth_creds.json). Vendor terms may
# restrict this; Antigravity quota never needs it.
# antigravity_model_catalog = false
# "even" (default): under the default "pro_rata" allowance below, `gate`
# enforces the pro-rata line and a 10-minute burst check for a 5h request;
# `fill` only offers a window's full remaining points in its last 45
# minutes, the pro-rata allowance before that. "none" skips both, leaving
# only the plain reserve/plan-line checks under "pro_rata".
pacing = "even"
# "pro_rata" (default) protects an even planned share throughout a 5h
# window, subject to `pacing` above (a no-op under "none"). "fill" is for an
# orchestrator that intentionally spends a use-it-or-lose-it window before
# reset; it projects current usage, open leases, and recent burn to the
# lane end while retaining the cap -- unlike "pro_rata", this always runs
# and can always refuse, regardless of `pacing`.
# allowance = "pro_rata"
# Check the npm registry at most once every 24 hours for a newer headroomd
# and print a one-line notice from `status`/`doctor`. Never installs
# anything on its own; set false to disable the check entirely.
update_check = true
# Proxy environment variables are ignored. Set this explicitly when a proxy is required.
# proxy = "http://127.0.0.1:8080"
# Extra safe directories to scan for statusline snapshots. The default is
# ~/.headroom/statusline only. Paths are expanded from ~ when read.
# statusline_snapshot_dirs = ["~/.headroom/statusline", "~/.collector/state"]
# Per-principal intervals override the default:
# [principal.claude-main]
# interval_minutes = 5
# A protected reserve per meter: percent of EVERY window of that meter that
# gate, fill, route and can never dip into (0-90). Unlike freeze_reserve_pct
# above, which is the FREEZE pace threshold, this only withholds capacity from
# decisions -- pace states are unchanged. Set one on the meter your own
# orchestrator runs on. "*" is the default for meters without their own entry.
# [reserve]
# "claude-main:fable" = 10
# "*" = 5
#
# A reserve entry can instead carry a reason and an expiry, in its own
# sibling table (headroom policy set/clear reserve manages this for you):
# [reserve."codex-main:main"]
# percent = 30
# reason = "stop new Codex builds at 70% used"
# set_at = "2026-09-23T09:00:00Z"
# until = "2026-09-30T00:00:00Z"          # optional: no longer applies once past
# unless = "banked_reset_available"       # optional: suspended while a banked reset is usable
#
# freeze_reserve_pct can carry the same reason/set_at/until, informationally,
# in its own table:
# [freeze_reserve]
# reason = "burn the week to 100%, then press a banked reset"
# set_at = "2026-09-27T08:00:00Z"

# Host guard: `headroom run` refuses to launch its child process onto a host
# that cannot take it (see docs/concepts.md's "Host guard" section). `can` and
# `gate` carry the same reading additively and never refuse over it.
# [host_guard]
# mode = "refuse" # "warn" only logs and still launches; "off" disables the guard entirely
# warn_load_ratio = 2 # os.loadavg()[0] / cpu count
# refuse_load_ratio = 3
# warn_pty_percent = 50 # in-use / configured pseudo-terminals, POSIX only
# refuse_pty_percent = 75
# Orphaned agy/script processes (see doctor's own dedicated check) always
# only warn, never refuse, however many are found -- not configurable here.

# --- Notifications (off unless you uncomment [notify] and name a channel) ---
# Delivered by the daemon after each poll, once per event, over the channels
# below. Credentials are never written here: the Telegram bot token and the
# optional webhook bearer are read from the OS secret store at send time.
# Run headroom notify configure for the interactive picker.
# See docs/notifications.md for the store command on each platform.
# [notify]
# channels = ["telegram", "ntfy", "webhook"]
# preset = "calm" # quiet: urgent changes only; everything: every event
# events_on = [] # add "reset_scheduled_short" to include scheduled 5h resets
# events_off = [] # overrides win over the preset and events_on
# Legacy replacement for a preset's base list. New configurations should use
# preset plus events_on/events_off instead.
# events = ["reset_unscheduled", "threshold"]
# Accepted for older policies only; use events_on above instead.
# notify_scheduled_short = false
# # Also notify when any hard window crosses this used percent, once per window.
# threshold_percent = 90
# # Local time. Events inside the range are batched into one message at the end of it.
# quiet_hours = "23:00-07:00"
#
# [notify.telegram]
# chat_id = "123456"
#
# [notify.ntfy]
# topic = "headroom-example"
# # server = "https://ntfy.example.com"
#
# [notify.webhook]
# url = "https://example.com/hook"
