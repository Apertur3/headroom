# Copy to ~/.headroom/routing.toml. An action may consume several overlapping meters.
local_preference = "fallback" # fallback | prefer | never
[consumes]
claude-fable = ["claude-main:all", "claude-main:fable"]
codex-build = ["codex-main:main"]
gemini-bulk = ["antigravity:gemini"]

# Declared cost per action class, used by `headroom fill` to say how many runs
# of each class fit in a window's remaining points and remaining minutes
# before reset. A learned median (once `can --lease` or `lease start --class`
# has recorded enough real spend) always overrides these static numbers.
[cost.review]
percent = 4
duration_minutes = 5

[cost.design-pass]
percent = 8
duration_minutes = 10

[cost.fable-build-round]
percent = 15
duration_minutes = 20
