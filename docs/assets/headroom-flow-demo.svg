<svg xmlns="http://www.w3.org/2000/svg" width="760" height="252" viewBox="0 0 760 252" role="img" aria-label="Terminal: an agent asks headroom can, is told NO for the nearly full Codex week, and falls back to Claude">
  <title>headroom can: NO for the nearly full meter, YES for the one with room</title>
  <g font-family="SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <rect x="0.5" y="0.5" width="759" height="251" rx="10" fill="#0d1117" stroke="#30363d"/>
    <path d="M0.5 10.5a10 10 0 0 1 10-10h739a10 10 0 0 1 10 10V40H0.5z" fill="#161b22"/>
    <circle cx="24" cy="21" r="6" fill="#ff5f56"/><circle cx="44" cy="21" r="6" fill="#ffbd2e"/><circle cx="64" cy="21" r="6" fill="#27c93f"/>
    <text x="380" y="26" fill="#8b949e" font-size="12" text-anchor="middle">headroom (synthetic data)</text>
    <text x="32" y="84" fill="#6e7681" font-size="14"># Agent: may I start a Codex build?</text>
    <text x="32" y="106" fill="#e6edf3" font-size="14"><tspan fill="#8b949e">$</tspan> headroom can codex-build --owner builder</text>
    <text x="32" y="128" fill="#e6edf3" font-size="14" xml:space="preserve"><tspan fill="#f85149" font-weight="700">NO</tspan> codex-main:main CONSERVE (wk 52% CONSERVE, resets in 5d)</text>
    <text x="32" y="162" fill="#6e7681" font-size="14"># Codex is spending ahead of its weekly pace. Try Claude:</text>
    <text x="32" y="184" fill="#e6edf3" font-size="14"><tspan fill="#8b949e">$</tspan> headroom can claude-heavy --owner builder</text>
    <text x="32" y="206" fill="#e6edf3" font-size="14" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">YES</tspan> claude-main:all HARVEST (wk 29% HARVEST, resets in 2d)</text>
  </g>
</svg>
